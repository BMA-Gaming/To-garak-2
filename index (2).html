<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>To'garakga qatnashmaysizmi</title>
<style>
/* ===================== TOKENLAR ===================== */
:root{
  --green:#22D07C; --green-d:#12A661;
  --violet:#8B6BFF; --violet-d:#6D46F5;
  --blue:#3E93FF;  --blue-d:#1E6EE0;
  --red:#FF5C6E;   --amber:#FFB648;

  --bg:#080B12; --bg2:#0E1320; --card:#131A2A; --card2:#182134;
  --line:#243049; --txt:#EAF0FA; --muted:#8B9BBB; --shadow:0 10px 30px rgba(0,0,0,.45);
  --accent:var(--violet);
  --r:16px; --r-s:10px;
}
[data-theme="light"]{
  --bg:#F4F6FB; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F2F5FB;
  --line:#E1E7F2; --txt:#0B1220; --muted:#61708C; --shadow:0 8px 24px rgba(16,32,64,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.45; letter-spacing:-.01em;
  overscroll-behavior-y:none;
}
@media (prefers-reduced-motion:no-preference){
  body,.card,.btn,.chip{transition:background-color .18s ease,color .18s ease,border-color .18s ease}
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.025em}
h1{font-size:23px} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}

/* ===================== KARKAS ===================== */
#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--bg);padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--violet),var(--blue) 55%,var(--green));
  color:#fff;font-weight:800;font-size:15px}
.brand b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;font-size:15px;flex:none}
.icon-btn:active{transform:scale(.94)}
main{flex:1;padding:14px}
.section{display:flex;flex-direction:column;gap:12px}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ===================== TAB BAR ===================== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,transparent)}
.tabs{display:flex;gap:2px;width:100%;max-width:580px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:5px;box-shadow:var(--shadow)}
.tab{flex:1;border:0;background:none;padding:7px 2px 6px;border-radius:13px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600}
.tab i{font-style:normal;font-size:17px;line-height:1}
.tab.on{background:var(--card2);color:var(--txt)}
.tab.on i{filter:none}
.tab .dot{position:absolute;margin:-14px 0 0 16px;width:7px;height:7px;border-radius:50%;background:var(--red)}

/* ===================== ELEMENTLAR ===================== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.spine{border-left:3px solid var(--accent)}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;
  padding:11px 15px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{border:0;background:linear-gradient(135deg,var(--violet-d),var(--blue));color:#fff}
.btn.go{border:0;background:var(--green-d);color:#fff}
.btn.danger{border-color:color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red)}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;font-size:15px;outline:none}
textarea{resize:vertical;min-height:88px;line-height:1.5}
.input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .pt{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chip.on{color:#fff;border-color:transparent;background:var(--accent)}
.chip.on .pt{background:#fff}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.open{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.badge.closed{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.badge.soft{background:var(--card2);color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:14px;object-fit:cover;flex:none;background:var(--card2);
  display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px}
.avatar.sm{width:38px;height:38px;border-radius:11px;font-size:14px}
.avatar.lg{width:72px;height:72px;border-radius:20px;font-size:24px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:38px 18px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
.kv{display:flex;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.kv span{display:inline-flex;align-items:center;gap:5px}
.sep{height:1px;background:var(--line);margin:2px 0}

/* fan katakchalari */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.tile{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;
  padding:34px 10px 11px;text-align:left;cursor:pointer;font-weight:600;font-size:13px;line-height:1.25;
  overflow:hidden;min-height:84px}
.tile::before{content:attr(data-mark);position:absolute;top:6px;left:10px;font-size:20px;font-weight:800;
  color:var(--tc);opacity:.95}
.tile::after{content:"";position:absolute;right:-16px;top:-16px;width:44px;height:44px;border-radius:50%;
  background:var(--tc);opacity:.14}
.tile.on{border-color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 35%,transparent)}
.tile small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:3px}

/* onboarding */
.hero{border-radius:20px;padding:22px;color:#fff;
  background:radial-gradient(120% 120% at 0% 0%,var(--violet-d) 0%,var(--blue-d) 48%,#0B2D22 100%)}
.hero h1{font-size:25px;line-height:1.15}
.hero p{margin-top:8px;opacity:.85;font-size:14px}
.steps{display:flex;gap:5px;margin-bottom:4px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.pick{display:flex;flex-direction:column;gap:10px}
.pick .opt{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line);background:var(--card)}
.pick .opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.pick .opt .em{font-size:24px}
.pick .opt.lock{opacity:.5;cursor:not-allowed}

/* chat */
.thread{display:flex;flex-direction:column;gap:8px;padding:4px 0 8px}
.bubble{max-width:82%;padding:9px 12px;border-radius:15px;font-size:14.5px;line-height:1.4;word-break:break-word}
.bubble.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--violet-d),var(--blue));color:#fff;border-bottom-right-radius:5px}
.bubble time{display:block;font-size:10px;opacity:.65;margin-top:3px;text-align:right}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:8px;
  padding:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:6px}
.composer .input{border:0;background:transparent;padding:8px 6px}
.composer .input:focus{box-shadow:none}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(3,6,14,.6);z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:600px;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (prefers-reduced-motion:no-preference){.sheet-bg.on .sheet{animation:up .22s ease}}
@keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
  background:var(--card);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;
  font-size:13.5px;font-weight:600;z-index:90;box-shadow:var(--shadow);max-width:90%;text-align:center}
.certs{display:flex;gap:8px;flex-wrap:wrap}
.certs img{width:78px;height:78px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.certs .del{position:relative;margin:-10px 0 0 -14px;background:var(--red);color:#fff;border:0;border-radius:50%;
  width:20px;height:20px;font-size:12px;cursor:pointer;z-index:2}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.loader{padding:34px;text-align:center;color:var(--muted);font-size:13px}

/* ===================== YANGI: AI / QUIZ / WIDGET ===================== */
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x>*{flex:none}

/* ob-havo + valyuta */
.wx{display:flex;gap:12px;align-items:center;border-radius:var(--r);padding:13px 14px;color:#fff;
  background:linear-gradient(135deg,#1E6EE0,#6D46F5 85%)}
.wx .ic{font-size:33px;line-height:1}
.wx b{font-size:25px;font-weight:800;letter-spacing:-.03em}
.wx .sm{font-size:11.5px;opacity:.85}
.wxd{display:flex;gap:6px;margin-top:10px}
.wxd div{flex:1;text-align:center;background:rgba(255,255,255,.14);border-radius:10px;padding:6px 2px;font-size:11px}
.wxd b{display:block;font-size:12.5px;font-weight:700}
.rate{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:8px 12px;min-width:104px}
.rate b{display:block;font-size:15px;font-weight:700}
.rate span{font-size:11px;color:var(--muted)}
.up{color:var(--green)} .down{color:var(--red)}

/* hub kartalari */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hub a{display:block;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:14px;
  cursor:pointer;color:var(--txt);position:relative;overflow:hidden}
.hub a .em{font-size:25px;display:block;margin-bottom:7px}
.hub a b{font-size:14px;display:block}
.hub a small{color:var(--muted);font-size:11.5px;line-height:1.35;display:block;margin-top:3px}
.hub a::after{content:"";position:absolute;right:-20px;top:-20px;width:54px;height:54px;border-radius:50%;
  background:var(--tc,var(--violet));opacity:.15}
.hub a.wide2{grid-column:span 2}

/* halqa (foiz) */
.ring{width:132px;height:132px;margin:0 auto;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .n{font-size:31px;font-weight:800;letter-spacing:-.03em}
.ring .n small{font-size:14px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:9px}
.bar b{font-size:12.5px;font-weight:600}
.bar .t{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12.5px}
.bar .r{height:7px;border-radius:4px;background:var(--card2);overflow:hidden}
.bar .r i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .5s ease}

/* ro'yxatlar (to'g'ri / xato / yetishmagan) */
.pts{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.pts li{list-style:none;display:flex;gap:8px;font-size:13.5px;line-height:1.4}
.pts li .mk{flex:none;font-size:13px;margin-top:1px}
ul.pts{padding:0;margin:9px 0 0}
.fx{background:var(--card2);border-radius:10px;padding:9px 11px;font-size:13px}
.fx s{color:var(--red);text-decoration:line-through;opacity:.8}
.fx em{color:var(--green);font-style:normal;font-weight:600}

/* formula qutisi */
.fml{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:7px}
.fml code{display:block;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:14.5px;color:var(--blue);
  margin:3px 0;word-break:break-word}
.fml b{font-size:12.5px} .fml small{color:var(--muted);font-size:11.5px}

/* viktorina */
.qz{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.qz button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:13px;
  padding:13px 14px;font-size:14.5px;cursor:pointer;display:flex;gap:10px;align-items:center;line-height:1.35}
.qz button .k{width:25px;height:25px;border-radius:8px;background:var(--card2);flex:none;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.qz button.on{border-color:var(--accent)} .qz button.on .k{background:var(--accent);color:#fff}
.qz button.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--card))}
.qz button.ok .k{background:var(--green-d);color:#fff}
.qz button.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 11%,var(--card))}
.qz button.no .k{background:var(--red);color:#fff}
.qz button[disabled]{pointer-events:none;opacity:1}
.prog{display:flex;gap:4px;margin-bottom:4px}
.prog i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)} .prog i.ok{background:var(--green)} .prog i.no{background:var(--red)}

/* peshqadamlar */
.lb{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);
  background:var(--card);border-radius:13px}
.lb.me{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.lb .pl{width:29px;text-align:center;font-weight:800;font-size:15px;color:var(--muted);flex:none}
.lb.g1 .pl{color:#FFD35C} .lb.g2 .pl{color:#C8D2E4} .lb.g3 .pl{color:#E0996A}
.lb .pts2{text-align:right;flex:none} .lb .pts2 b{display:block;font-size:15px}
.lb .pts2 span{font-size:10.5px;color:var(--muted)}

/* AI matni */
.md{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bubble.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);
  border-bottom-left-radius:5px;max-width:92%}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;
  animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ovozli kiritish */
.mic{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card2);
  display:grid;place-items:center;font-size:19px;cursor:pointer;flex:none}
.mic.rec{background:var(--red);border-color:transparent;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,92,110,.55)}70%{box-shadow:0 0 0 11px rgba(255,92,110,0)}}
.tabs.six .tab{font-size:9px} .tabs.six .tab i{font-size:16px}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" data-act="back" id="btnBack" hidden>←</button>
    <div class="brand">
      <div class="logo">T</div>
      <div style="min-width:0">
        <b id="hdTitle">To'garak</b>
        <small id="hdSub"></small>
      </div>
    </div>
    <button class="icon-btn" data-act="theme" id="btnTheme">🌙</button>
    <button class="icon-btn" data-act="settings">⚙️</button>
  </header>
  <main id="view"><div class="loader">…</div></main>
  <nav class="tabbar" id="tabbar" hidden><div class="tabs" id="tabs"></div></nav>
</div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>

/* ========================== TILLAR ========================== */

    fransuz_tili:"Француз тили",fizika:"Физика",kimyo:"Кимё",biologiya:"Биология",

function avatar(u, cls) {

function toast(msg) {

/* ========================== API ========================== */
function devId() {
  let id = LS.getItem("devid");
  if (!id) { id = String(900000 + Math.floor(Math.random() * 9000)); LS.setItem("devid", id); }
  return id;
}
async function api(path, body, method) {
  const headers = { "content-type": "application/json" };
  if (tg && tg.initData) headers["x-init-data"] = tg.initData; else headers["x-dev-id"] = devId();
  if (S.adminToken) headers["x-admin-token"] = S.adminToken;
  const res = await fetch(path, {
    method: method || (body ? "POST" : "GET"),
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || "error"); err.code = data.error; throw err; }
  return data;
}

const NEEDS_BACK = { mentor: 1, chat: 1, admin: 1, study: 1, topic: 1, result: 1,
  aichat: 1, quiz: 1, board: 1, mystat: 1, gchat: 1 };

async function go(screen, param) {
  if (!NEEDS_BACK[screen]) S.history = [];
  S.screen = screen; S.screenParam = param;
  clearInterval(S.timer); S.timer = null;
  try {
    if (screen === "search") { await loadMentors(); loadInfo(); }
    if (screen === "groups") S.groups = (await api("/api/groups?mine=1")).groups;
    if (screen === "requests") S.requests = (await api("/api/requests")).requests;
    if (screen === "chats") S.threads = (await api("/api/threads")).threads;
    if (screen === "mentor") { const r = await api("/api/mentor/" + param); S.mentor = r.mentor; S.mentorGroups = r.groups; }
    if (screen === "chat") { await loadChat(param); S.timer = setInterval(() => loadChat(param, true), 4000); }
    if (screen === "study") { S.stResult = null; if (S.stSubject) await loadHints(); }
    if (screen === "aichat") { S.aiMsgs = (await api("/api/ai/chat")).messages || []; }
    if (screen === "board") await loadBoard();
    if (screen === "mystat") S.stats = await api("/api/ai/stats");
    if (screen === "gchat") { await loadGChat(param); S.timer = setInterval(() => loadGChat(param, true), 5000); }
  } catch (e) { toast(errText(e)); }
  render();
  window.scrollTo(0, 0);
}
/* tarixni saqlab yangi ekranga o'tish */
function nav(screen, param) { S.history.push({ s: S.screen, p: S.screenParam }); go(screen, param); }

function errText(e) {
  const map = { mentor_age: T.mentorAgeErr, student_age: T.studentAgeErr, group_closed: T.closed,
    group_full: T.full, blocked: T.blocked, bad_credentials: T.badCreds,
    ai_off: T.aiOff, ai_limit: T.aiLimit, ai_error: T.error, ai_parse: T.error,
    answer_short: T.shortAns, not_member: T.notMember };
  return map[e && e.code] || T.error;
}
async function loadMentors() {
  const p = new URLSearchParams({ subject: S.subject, q: S.q, status: S.status });
  S.mentors = (await api("/api/mentors?" + p)).mentors;
}
async function loadChat(peer, silent) {
  const r = await api("/api/messages?peer=" + encodeURIComponent(peer));
  S.chat = r.peer; S.messages = r.messages;
  if (silent) { renderChatBody(); }
}
async function loadInfo() {
  if (S.info) return;
  try { S.info = await api("/api/info"); if (S.screen === "search") renderInfo(); } catch (e) {}
}
async function loadHints() {
  try { S.stHints = (await api("/api/ai/hints?subject=" + encodeURIComponent(S.stSubject))).hints || []; }
  catch (e) { S.stHints = []; }
}
async function loadBoard() {
  const p = new URLSearchParams({ period: S.boardPeriod, subject: S.boardSubject });
  S.board = await api("/api/quiz/leaderboard?" + p);
}
async function loadGChat(id, silent) {
  const r = await api("/api/group/messages?id=" + encodeURIComponent(id));
  S.gchat = r.group; S.gwho = r.who; S.gmsgs = r.messages;
  if (silent) renderGBody();
}
async function loadBadges() {
  try {
    const t = await api("/api/threads");
    S.threads = t.threads;
    S.unread = t.threads.reduce((a, x) => a + x.unread, 0);
    if (S.me && S.me.role === "mentor") {
      const r = await api("/api/requests");
      S.requests = r.requests;
      S.pending = r.requests.filter(x => x.status === "pending").length;
    }
    renderTabs();
  } catch (e) {}
}

function render() {
  T = I18N[S.lang];
  $("#hdTitle").textContent = T.app;
  $("#hdSub").textContent = S.me && S.me.role ? (S.me.role === "mentor" ? T.mentor : T.student) : T.sub;
  $("#btnBack").hidden = !NEEDS_BACK[S.screen];
  const v = $("#view");
  const R = { onboard: viewOnboard, search: viewSearch, mentor: viewMentor, groups: viewGroups,
    requests: viewRequests, chats: viewChats, chat: viewChat, profile: viewProfile, admin: viewAdmin,
    ai: viewAI, study: viewStudy, topic: viewTopic, result: viewResult, aichat: viewAiChat,
    quiz: viewQuiz, board: viewBoard, mystat: viewStats, gchat: viewGChat };
  v.innerHTML = (R[S.screen] || viewSearch)();
  renderTabs();
  if (S.screen === "chat") { const t = $("#thread"); if (t) t.scrollIntoView({ block: "end" }); }
  if (S.screen === "aichat" || S.screen === "gchat") { const t = $("#thread"); if (t) t.scrollIntoView({ block: "end" }); }
  if (S.screen === "result") drawRings();
}

const TAB_OF = { ai: "ai", study: "ai", topic: "ai", result: "ai", aichat: "ai",

function renderTabs() {
  const bar = $("#tabbar");
  if (!S.me || !S.me.role || S.screen === "onboard" || S.screen === "admin") { bar.hidden = true; return; }
  bar.hidden = false;
  const items = S.me.role === "mentor"
    ? [["search","🔍",T.search],["groups","👥",T.groups],["requests","📨",T.requests],["ai","🧠",T.ai],["chats","💬",T.chats],["profile","👤",T.profile]]
    : [["search","🔍",T.search],["groups","👥",T.groups],["ai","🧠",T.ai],["chats","💬",T.chats],["profile","👤",T.profile]];
  const active = TAB_OF[S.screen] || S.screen;
  $("#tabs").className = "tabs" + (items.length > 5 ? " six" : "");
  $("#tabs").innerHTML = items.map(([id, ic, label]) => {
    const dot = (id === "requests" && S.pending) || (id === "chats" && S.unread) ? '<span class="dot"></span>' : "";
    return '<button class="tab ' + (active === id ? "on" : "") + '" data-act="tab" data-val="' + id + '">' +
      '<i>' + ic + '</i>' + dot + '<span>' + esc(label) + "</span></button>";
  }).join("");
}

/* ==================== 13. TAHLIL NATIJASI ========================= */
function viewResult() {
  const r = S.stResult, t = S.topic || {};
  if (!r) return '<div class="loader">' + esc(T.loading) + "</div>";
  const tone = r.percent >= 75 ? "#22D07C" : r.percent >= 45 ? "#FFB648" : "#FF5C6E";
  const sc = r.scores || {};
  const bar = (label, v) => '<div class="bar"><div class="t"><b>' + esc(label) + "</b><span>" + v + "%</span></div>" +
    '<div class="r"><i data-w="' + v + '" style="width:0;background:' + (v >= 70 ? "#22D07C" : v >= 40 ? "#FFB648" : "#FF5C6E") + '"></i></div></div>';

  let out = '<div class="section">' +
    '<div class="card" style="text-align:center">' +
    '<div class="ring" data-p="' + r.percent + '" data-c="' + tone + '">' +
    '<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--card2)" stroke-width="11"></circle>' +
    '<circle class="pg" cx="60" cy="60" r="52" fill="none" stroke="' + tone + '" stroke-width="11" ' +
    'stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327"></circle></svg>' +
    '<div class="n" style="color:' + tone + '">' + r.percent + "<small>%</small></div></div>" +
    '<p class="tiny muted" style="margin-top:7px">' + esc(T.similarity) + "</p>" +
    (r.verdict ? '<p style="margin-top:9px;font-size:14px">' + esc(r.verdict) + "</p>" : "") + "</div>" +
    '<div class="card bars">' +
    bar(T.concept, sc.tushuncha || 0) + bar(T.fmlS, sc.formulalar || 0) +
    bar(T.trmS, sc.atamalar || 0) + bar(T.fullness, sc.toliqlik || 0) + "</div>";

  const block = (title, arr, mark, color) => (arr && arr.length)
    ? '<div class="card"><label class="tiny muted" style="color:' + color + '">' + esc(title) +
      " · " + arr.length + "</label><ul class=\"pts\">" + arr.map(x =>
        '<li><span class="mk" style="color:' + color + '">' + mark + "</span><span>" + esc(x) + "</span></li>").join("") + "</ul></div>"
    : "";

  out += block(T.gotRight, r.correct, "✓", "#22D07C");
  out += block(T.forgot, r.missing, "•", "#FFB648");
  if (r.wrong && r.wrong.length)
    out += '<div class="card"><label class="tiny muted" style="color:#FF5C6E">' + esc(T.mistakes) +
      " · " + r.wrong.length + '</label><div class="pts">' + r.wrong.map(w =>
        '<div class="fx"><s>' + esc(w.said) + "</s><br><em>→ " + esc(w.fix) + "</em></div>").join("") + "</div></div>";
  out += block(T.missedF, r.formulasMissed, "ƒ", "#3E93FF");
  if (r.advice)
    out += '<div class="card spine" style="--accent:var(--violet)"><label class="tiny muted">💡 ' + esc(T.advice) +
      '</label><p style="margin-top:6px;font-size:14px;line-height:1.5">' + esc(r.advice) + "</p></div>";

  out += '<div class="two"><button class="btn" data-act="st-retry">↻ ' + esc(T.tryAgain) + "</button>" +
    '<button class="btn primary" data-act="go-study">' + esc(T.newTopic) + "</button></div></div>";
  return out;
}
/* halqa va ustunlarni jonlantirish */
function drawRings() {
  setTimeout(() => {
    const ring = $(".ring");
    if (ring) {
      const p = Math.max(0, Math.min(100, +ring.dataset.p || 0));
      const c = $(".pg", ring);
      if (c) c.style.strokeDashoffset = String(327 - (327 * p) / 100);
      if (c) c.style.transition = "stroke-dashoffset .9s ease";
    }

let REC = null;
function voiceInto(inputId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast(T.noVoice);
  const el = $("#" + inputId);
  if (!el) return;
  if (REC) { try { REC.stop(); } catch (e) {} REC = null; return; }

  const r = new SR();
  r.lang = { uz: "uz-UZ", cyr: "uz-UZ", ru: "ru-RU", en: "en-US" }[S.lang] || "uz-UZ";
  r.continuous = true; r.interimResults = true;
  const base = el.value;
  const mic = $("#mic"); if (mic) mic.classList.add("rec");
  toast(T.listening);

  r.onresult = (ev) => {
    let txt = "";
    for (let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    el.value = (base ? base + " " : "") + txt;
    if (inputId === "st-ans") S.stAnswer = el.value;
  };
  r.onerror = () => { toast(T.error); stopVoice(); };
  r.onend = () => stopVoice();
  try { r.start(); REC = r; } catch (e) { toast(T.noVoice); stopVoice(); }
}
function stopVoice() {
  REC = null;
  const mic = $("#mic"); if (mic) mic.classList.remove("rec");
}

  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try { S.edit.certs.push(await shrink(f)); grabProfile(); drawProfileSheet(); }
    catch (e) { toast(T.error); }
  };
  inp.click();
}
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

const ACT = {
  back() {
    closeSheet();

    go(h ? h.s : (S.me.role === "mentor" ? "groups" : "search"), h ? h.p : undefined);

  /* ro'yxatdan o'tish */
  "ob-role"(v) { S.ob.role = v; render(); },
  "ob-subject"(v) {
    const i = S.ob.subjects.indexOf(v);
    if (i < 0) S.ob.subjects.push(v); else S.ob.subjects.splice(i, 1);
    render();
  },
  "ob-back"() { if (S.ob.step > 0) { S.ob.step -= (S.ob.step === 5 && S.ob.role === "student" ? 2 : 1); render(); } },
  async "ob-next"() {
    const ob = S.ob, st = ob.step;
    if (st === 1) {
      ob.age = ($("#f-age") || {}).value || "";
      const a = +ob.age;
      if (!a || a < 5 || a > 99) return toast(T.required);
    }
    if (st === 2) { ob.name = (($("#f-name") || {}).value || "").trim(); if (ob.name.length < 3) return toast(T.required); }
    if (st === 3) {
      if (!ob.role) return toast(T.role);
      if (ob.role === "mentor" && +ob.age < 18) return toast(T.mentorAgeErr);
      if (ob.role === "student" && +ob.age > 18) return toast(T.studentAgeErr);
    }
    if (st === 4 && ob.role === "mentor" && !ob.subjects.length) return toast(T.atLeastOne);
    if (st === 5) {
      ob.phone = (($("#f-phone") || {}).value || "").trim();
      if (ob.phone.replace(/\D/g, "").length < 7) return toast(T.required);
      try {
        const r = await api("/api/profile", { role: ob.role, age: +ob.age, name: ob.name,
          phone: ob.phone, subjects: ob.subjects, lang: S.lang });
        S.me = r.me; toast(T.saved);
        return go(ob.role === "mentor" ? "profile" : "search");
      } catch (e) { return toast(errText(e)); }
    }
    ob.step += (st === 3 && ob.role === "student" ? 2 : 1);
    render();
  },

  subject(v) { S.subject = v; go("search"); },
  status(v) { S.status = v; go("search"); },
  mentor(v) { S.history.push({ s: S.screen, p: S.screenParam }); go("mentor", v); },
  write(v) { S.history.push({ s: S.screen, p: S.screenParam }); go("chat", v); },

  async send() {
    const box = $("#msg"); const text = (box.value || "").trim();

    catch (e) { toast(errText(e)); }
  },

  /* guruhlar */
  "new-group"() { sheetGroup(null); },
  "edit-group"(v) { sheetGroup(S.groups.find(g => g.id === v)); },
  "g-day"(v) {

  },
  "g-open"() { grabGroup(); S.gedit.open = !S.gedit.open; drawGroupSheet(); },
  async "save-group"() {

  "edit-profile"() { sheetProfile(); },
  "e-subject"(v) {

    drawProfileSheet();
  },

  /* ---------- AI BO'LIMI ---------- */
  "go-study"() { S.topic = null; S.stResult = null; S.stAnswer = ""; nav("study"); },
  "go-aichat"() { nav("aichat"); },
  "go-quiz"() { S.qz = null; S.qzResult = null; nav("quiz"); },
  "go-board"() { nav("board"); },
  "go-stats"() { nav("mystat"); },

  /* mavzu tahlili */
  "st-subject"(v) { S.stSubject = S.stSubject === v ? "" : v; LS.setItem("stsub", S.stSubject); go("study"); },
  "st-hint"(v) { S.stQuery = v; ACT["st-find"](); },
  async "st-find"() {
    const box = $("#st-q");

  },

    const a = $("#st-ans");
    S.stAnswer = ((a && a.value) || "").trim();
    if (S.stAnswer.length < 10) return toast(T.shortAns);
    stopVoice();
    S.stBusy = true; render();
    try {
      const r = await api("/api/ai/check", { topicId: S.topic.id, answer: S.stAnswer });

      haptic("medium"); nav("result");

  "st-retry"() { S.stResult = null; nav("topic"); },

  /* AI suhbat */
  "ai-voice"() { voiceInto("ai-msg"); },
  async "ai-send"() {
    const box = $("#ai-msg"); const text = ((box && box.value) || "").trim();
    if (!text || S.aiBusy) return;
    box.value = ""; stopVoice();
    S.aiMsgs.push({ role: "me", text, at: Date.now() });
    S.aiBusy = true; renderAiBody();
    try { S.aiMsgs = (await api("/api/ai/chat", { text })).messages; }
    catch (e) { S.aiMsgs.pop(); toast(errText(e)); }
    S.aiBusy = false; renderAiBody();
  },
  async "ai-clear"() {
    if (!confirm(T.sure)) return;
    try { await api("/api/ai/chat", { text: "-", reset: true }); S.aiMsgs = []; render(); }
    catch (e) { toast(errText(e)); }
  },

  /* viktorina */
  "qz-subject"(v) { S.qzSetup.subject = v; render(); },
  "qz-level"(v) { S.qzSetup.level = v; render(); },
  "qz-count"(v) { S.qzSetup.count = +v; render(); },
  async "qz-start"() {
    const st = S.qzSetup;
    if (!st.subject) return toast(T.pickSubject);
    S.qzBusy = true; render();
    try {
      const r = await api("/api/quiz/start", { subject: st.subject, level: st.level, count: st.count });
      S.qz = { sid: r.sid, subject: r.subject, questions: r.questions, i: 0, answers: [] };
      S.qzResult = null;
    } catch (e) { toast(errText(e)); }
    S.qzBusy = false; render();
  },
  "qz-pick"(v) { haptic(); S.qz.answers[S.qz.i] = +v; render(); },
  "qz-next"() { if (S.qz.i < S.qz.questions.length - 1) { S.qz.i++; render(); window.scrollTo(0, 0); } },
  "qz-prev"() { if (S.qz.i > 0) { S.qz.i--; render(); window.scrollTo(0, 0); } },
  async "qz-finish"() {
    S.qzBusy = true; render();
    try {
      const r = await api("/api/quiz/submit", { sid: S.qz.sid, answers: S.qz.answers });
      S.qzResult = r; S.qz = null; haptic("medium");
    } catch (e) { toast(errText(e)); }
    S.qzBusy = false; render(); window.scrollTo(0, 0);
  },

  "g-chat"(v) { S.history.push({ s: S.screen, p: S.screenParam }); go("gchat", v); },
  async "g-send"() {
    const box = $("#gmsg"); const text = ((box && box.value) || "").trim();
    if (!text) return;
    box.value = "";
    try { await api("/api/group/messages", { id: S.gchat.id, text }); await loadGChat(S.gchat.id, true); }

  async "admin-group"(v) {

async function loadAdmin() {
  try { S.adminData = await api("/api/admin/overview"); }
  catch (e) { S.adminToken = ""; LS.removeItem("adm"); S.adminData = null; toast(T.badCreds); }

/* ========================== HODISALAR ========================== */
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const fn = ACT[b.dataset.act];
  if (fn) { ev.preventDefault(); fn(b.dataset.val, b); }
});
let qTimer = null;
document.addEventListener("input", (ev) => {
  if (ev.target.id === "st-ans") { S.stAnswer = ev.target.value; return; }
  if (ev.target.id === "st-q") { S.stQuery = ev.target.value; return; }
  if (ev.target.id !== "q") return;
  S.q = ev.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    await loadMentors();
    const box = $("#view");
    const pos = ev.target.selectionStart;
    render();
    const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} }
  }, 350);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  const id = ev.target.id;
  if (id === "msg") { ev.preventDefault(); ACT.send(); }
  if (id === "ai-msg") { ev.preventDefault(); ACT["ai-send"](); }
  if (id === "gmsg") { ev.preventDefault(); ACT["g-send"](); }
  if (id === "st-q") { ev.preventDefault(); ACT["st-find"](); }
});
$("#sheetBg").addEventListener("click", (ev) => { if (ev.target.id === "sheetBg") closeSheet(); });

/* ========================== ISHGA TUSHISH ========================== */
async function boot() {
  applyTheme();
  try { tg.ready(); tg.expand(); if (tg.colorScheme && !LS.getItem("theme")) { S.theme = tg.colorScheme; applyTheme(); } } catch (e) {}
  try {
    const r = await api("/api/auth", { lang: S.lang });
    S.me = r.me;
    if (!LS.getItem("lang") && r.me.lang && I18N[r.me.lang]) { S.lang = r.me.lang; T = I18N[S.lang]; }
    if (!r.registered) {
      S.ob = { step: 0, age: "", name: S.me.tgName || "", role: "", subjects: [], phone: "" };
      S.screen = "onboard"; render();
    } else {
      await go(S.me.role === "mentor" ? "groups" : "search");
      loadBadges();
      setInterval(loadBadges, 25000);
    }
  } catch (e) {
    $("#view").innerHTML = '<div class="empty"><div class="big">⚠️</div>' + esc(T.error) +
      '<p class="tiny" style="margin-top:8px">' + esc(e.message || "") + "</p></div>";
  }
}
boot();
