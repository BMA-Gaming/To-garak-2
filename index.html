<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kursga qatnashmaysizmi</title>
<style>
/* ===================== TOKENLAR ===================== */
:root{
  --green:#22D07C; --green-d:#12A661;
  --violet:#8B6BFF; --violet-d:#6D46F5;
  --blue:#3E93FF;  --blue-d:#1E6EE0;
  --red:#FF5C6E;   --amber:#FFB648;

  --bg:#080B12; --bg2:#0E1320; --card:#131A2A; --card2:#182134;
  --line:#243049; --txt:#EAF0FA; --muted:#8B9BBB; --shadow:0 10px 30px rgba(0,0,0,.45);
  --accent:var(--violet);
  --r:16px; --r-s:10px;
}
[data-theme="light"]{
  --bg:#F4F6FB; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F2F5FB;
  --line:#E1E7F2; --txt:#0B1220; --muted:#61708C; --shadow:0 8px 24px rgba(16,32,64,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.45; letter-spacing:-.01em;
  overscroll-behavior-y:none;
}
@media (prefers-reduced-motion:no-preference){
  body,.card,.btn,.chip{transition:background-color .18s ease,color .18s ease,border-color .18s ease}
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.025em}
h1{font-size:23px} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}

/* ===================== KARKAS ===================== */
#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--bg);padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--violet),var(--blue) 55%,var(--green));
  color:#fff;font-weight:800;font-size:15px}
.brand b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;font-size:15px;flex:none}
.icon-btn:active{transform:scale(.94)}
main{flex:1;padding:14px}
.section{display:flex;flex-direction:column;gap:12px}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ===================== TAB BAR ===================== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,transparent)}
.tabs{display:flex;gap:2px;width:100%;max-width:580px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:5px;box-shadow:var(--shadow)}
.tab{flex:1;border:0;background:none;padding:7px 2px 6px;border-radius:13px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600}
.tab i{font-style:normal;font-size:17px;line-height:1}
.tab.on{background:var(--card2);color:var(--txt)}
.tab.on i{filter:none}
.tab .dot{position:absolute;margin:-14px 0 0 16px;width:7px;height:7px;border-radius:50%;background:var(--red)}

/* ===================== ELEMENTLAR ===================== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.spine{border-left:3px solid var(--accent)}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;
  padding:11px 15px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{border:0;background:linear-gradient(135deg,var(--violet-d),var(--blue));color:#fff}
.btn.go{border:0;background:var(--green-d);color:#fff}
.btn.danger{border-color:color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red)}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;font-size:15px;outline:none}
textarea{resize:vertical;min-height:88px;line-height:1.5}
.input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .pt{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chip.on{color:#fff;border-color:transparent;background:var(--accent)}
.chip.on .pt{background:#fff}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.open{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.badge.closed{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.badge.soft{background:var(--card2);color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:14px;object-fit:cover;flex:none;background:var(--card2);
  display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px}
.avatar.sm{width:38px;height:38px;border-radius:11px;font-size:14px}
.avatar.lg{width:72px;height:72px;border-radius:20px;font-size:24px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:38px 18px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
.kv{display:flex;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.kv span{display:inline-flex;align-items:center;gap:5px}
.sep{height:1px;background:var(--line);margin:2px 0}

/* fan katakchalari */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.tile{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;
  padding:34px 10px 11px;text-align:left;cursor:pointer;font-weight:600;font-size:13px;line-height:1.25;
  overflow:hidden;min-height:84px}
.tile::before{content:attr(data-mark);position:absolute;top:6px;left:10px;font-size:20px;font-weight:800;
  color:var(--tc);opacity:.95}
.tile::after{content:"";position:absolute;right:-16px;top:-16px;width:44px;height:44px;border-radius:50%;
  background:var(--tc);opacity:.14}
.tile.on{border-color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 35%,transparent)}
.tile small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:3px}

/* onboarding */
.hero{border-radius:20px;padding:22px;color:#fff;
  background:radial-gradient(120% 120% at 0% 0%,var(--violet-d) 0%,var(--blue-d) 48%,#0B2D22 100%)}
.hero h1{font-size:25px;line-height:1.15}
.hero p{margin-top:8px;opacity:.85;font-size:14px}
.steps{display:flex;gap:5px;margin-bottom:4px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.pick{display:flex;flex-direction:column;gap:10px}
.pick .opt{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line);background:var(--card)}
.pick .opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.pick .opt .em{font-size:24px}
.pick .opt.lock{opacity:.5;cursor:not-allowed}

/* chat */
.thread{display:flex;flex-direction:column;gap:8px;padding:4px 0 8px}
.bubble{max-width:82%;padding:9px 12px;border-radius:15px;font-size:14.5px;line-height:1.4;word-break:break-word}
.bubble.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--violet-d),var(--blue));color:#fff;border-bottom-right-radius:5px}
.bubble time{display:block;font-size:10px;opacity:.65;margin-top:3px;text-align:right}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:8px;
  padding:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:6px}
.composer .input{border:0;background:transparent;padding:8px 6px}
.composer .input:focus{box-shadow:none}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(3,6,14,.6);z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:600px;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (prefers-reduced-motion:no-preference){.sheet-bg.on .sheet{animation:up .22s ease}}
@keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
  background:var(--card);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;
  font-size:13.5px;font-weight:600;z-index:90;box-shadow:var(--shadow);max-width:90%;text-align:center}
.certs{display:flex;gap:8px;flex-wrap:wrap}
.certs img{width:78px;height:78px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.certs .del{position:relative;margin:-10px 0 0 -14px;background:var(--red);color:#fff;border:0;border-radius:50%;
  width:20px;height:20px;font-size:12px;cursor:pointer;z-index:2}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.loader{padding:34px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>

/* ========================== HOLAT ========================== */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const LS = window.localStorage;
const S = {
  lang: LS.getItem("lang") || "uz",
  theme: LS.getItem("theme") || "dark",
  me: null, screen: "search", subject: "", q: "", status: "all",
  mentors: [], mentor: null, groups: [], requests: [], threads: [],
  chat: null, messages: [], edit: null, adminToken: LS.getItem("adm") || "", adminData: null,
  history: [], timer: null
};
let T = I18N[S.lang];
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const subName = (id) => (SUB_NAME[S.lang] || SUB_NAME.uz)[id] || id;
const initials = (n) => String(n || "?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();

function avatar(u, cls) {
  const c = "avatar " + (cls || "");
  if (u && u.photo) return '<img class="' + c + '" src="' + esc(u.photo) + '" alt="">';
  const name = u ? (u.name || u.tgName) : "?";
  const col = SUB_COLOR[(u && u.subjects && u.subjects[0]) || "matematika"];
  return '<div class="' + c + '" style="background:' + col + '">' + esc(initials(name)) + "</div>";
}
function toast(msg) {
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}
function haptic(type) { try { tg.HapticFeedback.impactOccurred(type || "light"); } catch (e) {} }

/* ========================== API ========================== */
function devId() {
  let id = LS.getItem("devid");
  if (!id) { id = String(900000 + Math.floor(Math.random() * 9000)); LS.setItem("devid", id); }
  return id;
}
async function api(path, body, method) {
  const headers = { "content-type": "application/json" };
  if (tg && tg.initData) headers["x-init-data"] = tg.initData; else headers["x-dev-id"] = devId();
  if (S.adminToken) headers["x-admin-token"] = S.adminToken;
  const res = await fetch(path, {
    method: method || (body ? "POST" : "GET"),
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || "error"); err.code = data.error; throw err; }
  return data;
}

/* ========================== KO'RINISH ========================== */
function applyTheme() {
  document.documentElement.dataset.theme = S.theme;
  $("#btnTheme").textContent = S.theme === "dark" ? "☀️" : "🌙";
  try { tg.setHeaderColor(S.theme === "dark" ? "#080B12" : "#F4F6FB"); } catch (e) {}
}
function setLang(l) {
  S.lang = l; T = I18N[l]; LS.setItem("lang", l);
  document.documentElement.lang = l === "cyr" ? "uz" : l;
  api("/api/auth", { lang: l }).catch(() => {});
  render();
}

/* ========================== NAVIGATSIYA ========================== */
const NEEDS_BACK = { mentor: 1, chat: 1, admin: 1 };

async function go(screen, param) {
  if (!NEEDS_BACK[screen]) S.history = [];
  S.screen = screen; S.screenParam = param;
  clearInterval(S.timer); S.timer = null;
  try {
    if (screen === "search") await loadMentors();
    if (screen === "groups") S.groups = (await api("/api/groups?mine=1")).groups;
    if (screen === "requests") S.requests = (await api("/api/requests")).requests;
    if (screen === "chats") S.threads = (await api("/api/threads")).threads;
    if (screen === "mentor") { const r = await api("/api/mentor/" + param); S.mentor = r.mentor; S.mentorGroups = r.groups; }
    if (screen === "chat") { await loadChat(param); S.timer = setInterval(() => loadChat(param, true), 4000); }
  } catch (e) { toast(errText(e)); }
  render();
  window.scrollTo(0, 0);
}
function errText(e) {
  const map = { mentor_age: T.mentorAgeErr, student_age: T.studentAgeErr, group_closed: T.closed,
    group_full: T.full, blocked: T.blocked, bad_credentials: T.badCreds };
  return map[e && e.code] || T.error;
}
async function loadMentors() {
  const p = new URLSearchParams({ subject: S.subject, q: S.q, status: S.status });
  S.mentors = (await api("/api/mentors?" + p)).mentors;
}
async function loadChat(peer, silent) {
  const r = await api("/api/messages?peer=" + encodeURIComponent(peer));
  S.chat = r.peer; S.messages = r.messages;
  if (silent) { renderChatBody(); }
}
async function loadBadges() {
  try {
    const t = await api("/api/threads");
    S.threads = t.threads;
    S.unread = t.threads.reduce((a, x) => a + x.unread, 0);
    if (S.me && S.me.role === "mentor") {
      const r = await api("/api/requests");
      S.requests = r.requests;
      S.pending = r.requests.filter(x => x.status === "pending").length;
    }
    renderTabs();
  } catch (e) {}
}

/* ========================== RENDER ========================== */
function render() {
  T = I18N[S.lang];
  $("#hdTitle").textContent = T.app;
  $("#hdSub").textContent = S.me && S.me.role ? (S.me.role === "mentor" ? T.mentor : T.student) : T.sub;
  $("#btnBack").hidden = !NEEDS_BACK[S.screen];
  const v = $("#view");
  const R = { onboard: viewOnboard, search: viewSearch, mentor: viewMentor, groups: viewGroups,
    requests: viewRequests, chats: viewChats, chat: viewChat, profile: viewProfile, admin: viewAdmin };
  v.innerHTML = (R[S.screen] || viewSearch)();
  renderTabs();
  if (S.screen === "chat") { const t = $("#thread"); if (t) t.scrollIntoView({ block: "end" }); }
}
function renderTabs() {
  const bar = $("#tabbar");
  if (!S.me || !S.me.role || S.screen === "onboard" || S.screen === "admin") { bar.hidden = true; return; }
  bar.hidden = false;
  const items = S.me.role === "mentor"
    ? [["search","🔍",T.search],["groups","👥",T.groups],["requests","📨",T.requests],["chats","💬",T.chats],["profile","👤",T.profile]]
    : [["search","🔍",T.search],["groups","👥",T.groups],["chats","💬",T.chats],["profile","👤",T.profile]];
  $("#tabs").innerHTML = items.map(([id, ic, label]) => {
    const dot = (id === "requests" && S.pending) || (id === "chats" && S.unread) ? '<span class="dot"></span>' : "";
    return '<button class="tab ' + (S.screen === id ? "on" : "") + '" data-act="tab" data-val="' + id + '">' +
      '<i>' + ic + '</i>' + dot + '<span>' + esc(label) + "</span></button>";
  }).join("");
}

/* ---------- 1. RO'YXATDAN O'TISH ---------- */
function viewOnboard() {
  const ob = S.ob, step = ob.step;
  if (step === 0) {
    return '<div class="section">' +
      '<div class="hero"><h1>' + esc(T.welcomeT) + "</h1><p>" + esc(T.welcomeP) + "</p></div>" +
      '<div class="card"><div class="kv" style="flex-direction:column;align-items:flex-start;gap:8px">' +
      "<span>🔍 " + esc(T.search) + " — " + esc(T.pickSubject).toLowerCase() + "</span>" +
      "<span>📨 " + esc(T.join) + "</span><span>💬 " + esc(T.chats) + "</span></div></div>" +
      '<button class="btn primary wide" data-act="ob-next">' + esc(T.start) + "</button></div>";
  }
  const bars = [1,2,3,4,5].map(i => '<i class="' + (i <= step ? "on" : "") + '"></i>').join("");
  let inner = "";
  if (step === 1) inner =
    '<div class="field"><label>' + esc(T.age) + "</label>" +
    '<input class="input" id="f-age" type="number" inputmode="numeric" min="5" max="99" value="' + esc(ob.age) + '" placeholder="15"></div>' +
    '<p class="tiny muted">' + esc(T.ageHint) + "</p>";
  if (step === 2) inner =
    '<div class="field"><label>' + esc(T.fio) + "</label>" +
    '<input class="input" id="f-name" value="' + esc(ob.name) + '" placeholder="' + esc(T.fioPh) + '"></div>';
  if (step === 3) {
    const age = +ob.age;
    const mLock = age < 18, sLock = age > 18;
    inner = '<div class="pick">' +
      '<div class="opt ' + (ob.role === "mentor" ? "on" : "") + (mLock ? " lock" : "") + '" ' + (mLock ? "" : 'data-act="ob-role" data-val="mentor"') + '>' +
      '<div class="em">🎓</div><div><b>' + esc(T.mentor) + "</b><div class=\"tiny muted\">" +
      esc(mLock ? T.mentorLock : T.mentorDesc) + "</div></div></div>" +
      '<div class="opt ' + (ob.role === "student" ? "on" : "") + (sLock ? " lock" : "") + '" ' + (sLock ? "" : 'data-act="ob-role" data-val="student"') + '>' +
      '<div class="em">🎒</div><div><b>' + esc(T.student) + "</b><div class=\"tiny muted\">" +
      esc(sLock ? T.studentLock : T.studentDesc) + "</div></div></div></div>";
  }
  if (step === 4) inner =
    '<p class="tiny muted">' + esc(T.chooseSubjects) + " · " + ob.subjects.length + " " + esc(T.picked) + "</p>" +
    '<div class="grid">' + SUBJECTS.map(id => tile(id, ob.subjects.includes(id), "ob-subject")).join("") + "</div>";
  if (step === 5) inner =
    '<div class="card" style="display:flex;gap:12px;align-items:center">' + avatar(S.me) +
    "<div><b>" + esc(ob.name) + '</b><div class="tiny muted">' + esc(ob.age) + " " + esc(T.years) + " · " +
    esc(ob.role === "mentor" ? T.mentor : T.student) + "</div></div></div>" +
    '<div class="field"><label>' + esc(T.phone) + "</label>" +
    '<input class="input" id="f-phone" type="tel" inputmode="tel" value="' + esc(ob.phone || "+998") + '"></div>';

  const title = [, T.age, T.fio, T.role, T.subjects, T.phone][step];
  return '<div class="section"><div class="steps">' + bars + "</div><h2>" + esc(title) + "</h2>" + inner +
    '<div class="two" style="margin-top:6px">' +
    '<button class="btn" data-act="ob-back">' + esc(T.back) + "</button>" +
    '<button class="btn primary" data-act="ob-next">' + esc(step === 5 ? T.save : T.next) + "</button></div></div>";
}
function tile(id, on, act) {
  return '<button class="tile ' + (on ? "on" : "") + '" style="--tc:' + SUB_COLOR[id] + '" data-mark="' +
    esc(subName(id)[0]) + '" data-act="' + act + '" data-val="' + id + '">' + esc(subName(id)) + "</button>";
}

/* ---------- 2. QIDIRUV ---------- */
function viewSearch() {
  const chips = [["all", T.all], ["open", T.open], ["closed", T.closed]].map(([v, l]) =>
    '<button class="chip ' + (S.status === v ? "on" : "") + '" data-act="status" data-val="' + v + '">' + esc(l) + "</button>").join("");
  let head =
    '<input class="input" id="q" placeholder="' + esc(T.searchPh) + '" value="' + esc(S.q) + '">' +
    '<div class="chips">' + chips + "</div>";
  if (!S.subject) {
    return '<div class="section">' + head + "<h2>" + esc(T.pickSubject) + "</h2>" +
      '<div class="grid">' + SUBJECTS.map(id => tile(id, false, "subject")).join("") + "</div></div>";
  }
  const list = S.mentors.length
    ? S.mentors.map(mentorCard).join("")
    : '<div class="empty"><div class="big">🔎</div>' + esc(T.noMentors) + "</div>";
  return '<div class="section">' + head +
    '<div class="rowline"><h2 style="color:' + SUB_COLOR[S.subject] + '">' + esc(subName(S.subject)) + "</h2>" +
    '<button class="btn sm" data-act="subject" data-val="">✕ ' + esc(T.all) + "</button></div>" +
    '<p class="tiny muted">' + S.mentors.length + " " + esc(T.found) + "</p>" +
    '<div class="list">' + list + "</div></div>";
}
function mentorCard(m) {
  const col = SUB_COLOR[m.subjects[0]] || "#8B6BFF";
  return '<div class="card spine" style="--accent:' + col + '" data-act="mentor" data-val="' + m.id + '">' +

    '<span class="badge ' + (m.open ? "open" : "closed") + '">' + esc(m.open ? T.open : T.closed) + "</span></div>" +
    '<div class="chips" style="margin:6px 0">' + m.subjects.slice(0, 3).map(s =>
      '<span class="chip" style="padding:4px 9px;font-size:11.5px"><span class="pt" style="background:' +
      SUB_COLOR[s] + '"></span>' + esc(subName(s)) + "</span>").join("") +
    (m.subjects.length > 3 ? '<span class="chip" style="padding:4px 9px;font-size:11.5px">+' + (m.subjects.length - 3) + "</span>" : "") +

    (m.days.length ? "<span>📅 " + daysText(m.days) + "</span>" : "") + "</div></div></div></div>";

const daysText = (a) => (a && a.length) ? a.slice().sort((x, y) => x - y).map(d => T.dayShort[d]).join(", ") : T.notSet;
const timeText = (f, t) => (f && t) ? f + "–" + t : T.notSet;

function groupCard(g, mine) {
  const col = SUB_COLOR[g.subject] || "#8B6BFF";
  let action = "";
  if (mine) {
    action = '<div class="two" style="margin-top:10px">' +
      '<button class="btn sm" data-act="edit-group" data-val="' + g.id + '">' + esc(T.edit) + "</button>" +
      '<button class="btn sm danger" data-act="del-group" data-val="' + g.id + '">' + esc(T.del) + "</button></div>";
  } else if (S.me && S.me.role === "student") {
    if (g.joined) action = '<span class="badge open" style="margin-top:9px;display:inline-block">✓ ' + esc(T.joined) + "</span>";
    else if (g.pending) action = '<span class="badge soft" style="margin-top:9px;display:inline-block">⏳ ' + esc(T.sent) + "</span>";
    else if (!g.open) action = '<span class="badge closed" style="margin-top:9px;display:inline-block">' + esc(T.closed) + "</span>";
    else if (g.members.length >= g.limit) action = '<span class="badge closed" style="margin-top:9px;display:inline-block">' + esc(T.full) + "</span>";
    else action = '<button class="btn go sm wide" style="margin-top:10px" data-act="join" data-val="' + g.id + '">' + esc(T.join) + "</button>";
  }
  return '<div class="card spine" style="--accent:' + col + '">' +
    '<div class="rowline"><b>' + esc(g.title) + "</b>" +
    '<span class="badge soft">' + g.members.length + "/" + g.limit + "</span></div>" +
    '<div class="chips" style="margin:6px 0"><span class="chip" style="padding:4px 9px;font-size:11.5px">' +
    '<span class="pt" style="background:' + col + '"></span>' + esc(subName(g.subject)) + "</span></div>" +
    '<div class="kv tiny"><span>📅 ' + daysText(g.days) + "</span><span>🕒 " + timeText(g.timeFrom, g.timeTo) + "</span>" +
    "<span>⏳ " + g.duration + " " + esc(T.min) + "</span>" + (g.location ? "<span>📍 " + esc(g.location) + "</span>" : "") + "</div>" +
    (g.mentorName && !mine ? '<div class="tiny muted" style="margin-top:6px">🎓 ' + esc(g.mentorName) + "</div>" : "") + action + "</div>";
}

function grabGroup() {
  const g = (id) => { const el = $("#" + id); return el ? el.value : ""; };
  const x = S.gedit;
  x.title = g("g-title"); x.subject = g("g-subject"); x.timeFrom = g("g-from"); x.timeTo = g("g-to");
  x.duration = g("g-dur"); x.limit = g("g-limit"); x.location = g("g-loc");
}

/* --- sertifikat rasmini kichraytirish --- */
function pickCert() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try { S.edit.certs.push(await shrink(f)); grabProfile(); drawProfileSheet(); }
    catch (e) { toast(T.error); }
  };
  inp.click();
}
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ========================== HARAKATLAR ========================== */
const ACT = {
  back() {
    closeSheet();
    const h = S.history.pop();
    go(h ? h.s : (S.me.role === "mentor" ? "groups" : "search"), h ? h.p : undefined);
  },
  theme() { S.theme = S.theme === "dark" ? "light" : "dark"; LS.setItem("theme", S.theme); applyTheme(); },
  "theme-set"(v) { S.theme = v; LS.setItem("theme", v); applyTheme(); sheetSettings(); },
  settings() { sheetSettings(); },
  "close-sheet"() { closeSheet(); },
  lang(v) { setLang(v); sheetSettings(); },
  tab(v) { haptic(); go(v); },

  /* ro'yxatdan o'tish */
  "ob-role"(v) { S.ob.role = v; render(); },
  "ob-subject"(v) {
    const i = S.ob.subjects.indexOf(v);
    if (i < 0) S.ob.subjects.push(v); else S.ob.subjects.splice(i, 1);
    render();
  },
  "ob-back"() { if (S.ob.step > 0) { S.ob.step -= (S.ob.step === 5 && S.ob.role === "student" ? 2 : 1); render(); } },
  async "ob-next"() {
    const ob = S.ob, st = ob.step;
    if (st === 1) {
      ob.age = ($("#f-age") || {}).value || "";
      const a = +ob.age;
      if (!a || a < 5 || a > 99) return toast(T.required);
    }
    if (st === 2) { ob.name = (($("#f-name") || {}).value || "").trim(); if (ob.name.length < 3) return toast(T.required); }
    if (st === 3) {
      if (!ob.role) return toast(T.role);
      if (ob.role === "mentor" && +ob.age < 18) return toast(T.mentorAgeErr);
      if (ob.role === "student" && +ob.age > 18) return toast(T.studentAgeErr);
    }
    if (st === 4 && ob.role === "mentor" && !ob.subjects.length) return toast(T.atLeastOne);
    if (st === 5) {
      ob.phone = (($("#f-phone") || {}).value || "").trim();
      if (ob.phone.replace(/\D/g, "").length < 7) return toast(T.required);
      try {
        const r = await api("/api/profile", { role: ob.role, age: +ob.age, name: ob.name,
          phone: ob.phone, subjects: ob.subjects, lang: S.lang });
        S.me = r.me; toast(T.saved);
        return go(ob.role === "mentor" ? "profile" : "search");
      } catch (e) { return toast(errText(e)); }
    }
    ob.step += (st === 3 && ob.role === "student" ? 2 : 1);
    render();
  },

  /* qidiruv */
  subject(v) { S.subject = v; go("search"); },
  status(v) { S.status = v; go("search"); },
  mentor(v) { S.history.push({ s: S.screen, p: S.screenParam }); go("mentor", v); },
  write(v) { S.history.push({ s: S.screen, p: S.screenParam }); go("chat", v); },

  async send() {
    const box = $("#msg"); const text = (box.value || "").trim();
    if (!text) return;
    box.value = "";
    try { await api("/api/messages", { to: S.chat.id, text }); await loadChat(S.chat.id, true); }
    catch (e) { toast(errText(e)); }
  },

  /* guruhlar */
  "new-group"() { sheetGroup(null); },
  "edit-group"(v) { sheetGroup(S.groups.find(g => g.id === v)); },
  "g-day"(v) {
    grabGroup(); const i = +v, arr = S.gedit.days, k = arr.indexOf(i);
    if (k < 0) arr.push(i); else arr.splice(k, 1);
    drawGroupSheet();
  },
  "g-open"() { grabGroup(); S.gedit.open = !S.gedit.open; drawGroupSheet(); },
  async "save-group"() {
    grabGroup(); const g = S.gedit;
    if (!g.title.trim()) return toast(T.required);
    const body = { title: g.title, subject: g.subject, days: g.days, timeFrom: g.timeFrom,
      timeTo: g.timeTo, duration: +g.duration, limit: +g.limit, location: g.location, open: g.open };
    try {
      if (g.id) await api("/api/group/update", Object.assign({ id: g.id }, body));
      else await api("/api/groups", body);
      closeSheet(); toast(T.saved); go("groups");
    } catch (e) { toast(errText(e)); }
  },
  async "del-group"(v) {
    if (!confirm(T.sure)) return;
    try { await api("/api/group/update", { id: v, delete: true }); go("groups"); } catch (e) { toast(errText(e)); }
  },
  async join(v) {
    try { await api("/api/group/join", { id: v }); toast(T.sent); go(S.screen === "mentor" ? "mentor" : "groups", S.mentor && S.mentor.id); }
    catch (e) { toast(errText(e)); }
  },
  async decide(v) {
    const [id, yes] = v.split(":");
    try { await api("/api/request/decide", { id, accept: yes === "1" }); await loadBadges(); go("requests"); }
    catch (e) { toast(errText(e)); }
  },

  /* profil */
  "edit-profile"() { sheetProfile(); },
  "e-subject"(v) {
    grabProfile(); const arr = S.edit.subjects, i = arr.indexOf(v);
    if (i < 0) arr.push(v); else arr.splice(i, 1);
    drawProfileSheet();
  },
  "e-day"(v) {
    grabProfile(); const i = +v, arr = S.edit.days, k = arr.indexOf(i);
    if (k < 0) arr.push(i); else arr.splice(k, 1);
    drawProfileSheet();
  },
  "e-cert-add"() { grabProfile(); pickCert(); },
  "e-cert-del"(v) { grabProfile(); S.edit.certs.splice(+v, 1); drawProfileSheet(); },
  async "save-profile"() {
    grabProfile(); const e = S.edit;
    if (!e.name.trim()) return toast(T.required);
    const body = { name: e.name, age: +e.age, phone: e.phone, lang: S.lang };
    if (S.me.role === "mentor") Object.assign(body, {
      subjects: e.subjects, bio: e.bio, experience: +e.experience, studentsNow: +e.studentsNow,
      days: e.days, timeFrom: e.timeFrom, timeTo: e.timeTo, location: e.location, certs: e.certs
    });
    try { const r = await api("/api/profile", body); S.me = r.me; closeSheet(); toast(T.saved); render(); }
    catch (err) { toast(errText(err)); }
  },
  async "toggle-open"() {
    try { const r = await api("/api/profile", { open: !S.me.open }); S.me = r.me; render(); }
    catch (e) { toast(errText(e)); }
  },

  /* admin */
  admin() { closeSheet(); S.history.push({ s: S.screen, p: S.screenParam }); S.screen = "admin"; if (S.adminToken) loadAdmin(); else render(); },
  async "admin-login"() {
    const login = ($("#a-login") || {}).value || "", password = ($("#a-pass") || {}).value || "";
    try {
      const r = await api("/api/admin/login", { login, password });
      S.adminToken = r.token; LS.setItem("adm", r.token); loadAdmin();
    } catch (e) { toast(T.badCreds); }
  },
  "admin-out"() { S.adminToken = ""; S.adminData = null; LS.removeItem("adm"); render(); },
  async "admin-user"(v) {
    const [id, action] = v.split(":");
    if (action === "delete" && !confirm(T.sure)) return;
    try { await api("/api/admin/user", { id, action }); loadAdmin(); } catch (e) { toast(T.error); }
  },
  async "admin-group"(v) {
    if (!confirm(T.sure)) return;
    try { await api("/api/admin/group", { id: v, action: "delete" }); loadAdmin(); } catch (e) { toast(T.error); }
  }
};
async function loadAdmin() {
  try { S.adminData = await api("/api/admin/overview"); }
  catch (e) { S.adminToken = ""; LS.removeItem("adm"); S.adminData = null; toast(T.badCreds); }
  render();
}

/* ========================== HODISALAR ========================== */
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const fn = ACT[b.dataset.act];
  if (fn) { ev.preventDefault(); fn(b.dataset.val, b); }
});
let qTimer = null;
document.addEventListener("input", (ev) => {
  if (ev.target.id !== "q") return;
  S.q = ev.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    await loadMentors();
    const box = $("#view");
    const pos = ev.target.selectionStart;
    render();
    const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} }
  }, 350);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.id === "msg") { ev.preventDefault(); ACT.send(); }
});
$("#sheetBg").addEventListener("click", (ev) => { if (ev.target.id === "sheetBg") closeSheet(); });

/* ========================== ISHGA TUSHISH ========================== */
async function boot() {
  applyTheme();
  try { tg.ready(); tg.expand(); if (tg.colorScheme && !LS.getItem("theme")) { S.theme = tg.colorScheme; applyTheme(); } } catch (e) {}
  try {
    const r = await api("/api/auth", { lang: S.lang });
    S.me = r.me;
    if (!LS.getItem("lang") && r.me.lang && I18N[r.me.lang]) { S.lang = r.me.lang; T = I18N[S.lang]; }
    if (!r.registered) {
      S.ob = { step: 0, age: "", name: S.me.tgName || "", role: "", subjects: [], phone: "" };
      S.screen = "onboard"; render();
    } else {
      await go(S.me.role === "mentor" ? "groups" : "search");
      loadBadges();
      setInterval(loadBadges, 25000);
    }
  } catch (e) {
    $("#view").innerHTML = '<div class="empty"><div class="big">⚠️</div>' + esc(T.error) +
      '<p class="tiny" style="margin-top:8px">' + esc(e.message || "") + "</p></div>";
  }
}
boot();
